command:
  - "python"
  - "app.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: MOVIES_TABLE_NAME
    value: "movie_documents"
  - name: WATCHLIST_TABLE_NAME
    value: "movie_watchlist"
  - name: TMDB_SECRET_SCOPE
    value: "tmdb"
  - name: TMDB_SECRET_KEY
    value: "api-key"
